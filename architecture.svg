<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-label="Animated architecture: Streamlit UI sends a query to a LangGraph workflow, which uses Groq, a Tavily research agent, an AviationStack agent and a PostgreSQL checkpointer, then returns the answer to the UI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040812"/><stop offset="1" stop-color="#0e1636"/></linearGradient>
  <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#3b82ff"/><stop offset="1" stop-color="#22e4ff"/></linearGradient>
  <radialGradient id="gl"><stop offset="0" stop-color="#9b6bff" stop-opacity=".4"/><stop offset="1" stop-color="#9b6bff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#3b82ff" stroke-opacity=".07"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .f{fill:none;stroke:url(#ln);stroke-width:2;stroke-linecap:round;stroke-dasharray:5 9;animation:d 1.1s linear infinite}
    .rv{animation-direction:reverse}
    @keyframes d{to{stroke-dashoffset:-28}}
    .n{fill:#0a1124;stroke-width:1.8;filter:url(#glow);animation:p 3.6s ease-in-out infinite}
    @keyframes p{50%{fill:#142048}}
    .t{fill:#f0f4ff;font:700 14px 'Segoe UI',Arial,sans-serif;text-anchor:middle}
    .s{fill:#8f9bb8;font:12px 'Segoe UI',Arial,sans-serif;text-anchor:middle}
    .e{fill:#6f7ea3;font:11px 'Segoe UI',Arial,sans-serif}
    .h{animation:g 4.5s ease-in-out infinite;transform-origin:380px 262px}
    @keyframes g{50%{transform:scale(1.2);opacity:.55}}
    .o{fill:none;stroke:#9b6bff;stroke-opacity:.55;stroke-width:1.2;stroke-dasharray:3 10;transform-origin:380px 262px;animation:spin 18s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .st{animation:tw 3s ease-in-out infinite}
    @keyframes tw{50%{opacity:.15}}
    .in{animation:fade 1.2s both}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="860" height="520" rx="22" fill="url(#bg)"/>
<rect width="860" height="520" rx="22" fill="url(#grid)"/>
<g fill="#cfe3ff">
  <circle class="st" cx="70" cy="90" r="1.4"/><circle class="st" cx="210" cy="480" r="1.2" style="animation-delay:.7s"/>
  <circle class="st" cx="560" cy="40" r="1.4" style="animation-delay:1.4s"/><circle class="st" cx="800" cy="360" r="1.3" style="animation-delay:.3s"/>
  <circle class="st" cx="780" cy="470" r="1.2" style="animation-delay:2s"/><circle class="st" cx="500" cy="500" r="1.3" style="animation-delay:1s"/>
  <circle class="st" cx="150" cy="170" r="1.1" style="animation-delay:2.4s"/><circle class="st" cx="830" cy="60" r="1.2" style="animation-delay:1.7s"/>
</g>
<circle cx="30" cy="34" r="6" fill="#22e4ff" filter="url(#glow)"/>
<text x="46" y="39" fill="#f0f4ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Multi-Agent AI Travel Planner</text>
<text x="46" y="58" fill="#8f9bb8" font-family="Segoe UI,Arial,sans-serif" font-size="11">Conceptual architecture. Illustrative flow, not live data.</text>

<circle class="h" cx="380" cy="262" r="130" fill="url(#gl)"/>
<circle class="o" cx="380" cy="262" r="88"/>

<path class="f" d="M174 262 L316 262"/>
<path class="f" d="M380 198 L380 120"/>
<path class="f" d="M432 222 L620 148"/>
<path class="f" d="M444 262 L620 262"/>
<path class="f" d="M380 326 L380 420"/>
<path class="f rv" d="M330 304 Q 200 410 100 294"/>

<text class="e" x="226" y="248">query</text>
<text class="e" x="392" y="164">reason</text>
<text class="e" x="506" y="188">search</text>
<text class="e" x="500" y="252">flight data</text>
<text class="e" x="392" y="378">checkpoint state</text>
<text class="e" x="178" y="400">answer</text>

<rect class="n" x="24" y="230" width="150" height="64" rx="14" stroke="#22e4ff"/>
<text class="t" x="99" y="258">Streamlit UI</text><text class="s" x="99" y="277">chat interface</text>

<circle class="n" cx="380" cy="262" r="64" stroke="#9b6bff"/>
<text class="t" x="380" y="258">LangGraph</text><text class="s" x="380" y="278">workflow</text>

<rect class="n" x="290" y="56" width="180" height="64" rx="14" stroke="#ff9b3b" style="animation-delay:.5s"/>
<text class="t" x="380" y="84">Groq LLM</text><text class="s" x="380" y="103">reasoning and response</text>

<rect class="n" x="620" y="116" width="216" height="64" rx="14" stroke="#22e4ff" style="animation-delay:1s"/>
<text class="t" x="728" y="144">Web Research Agent</text><text class="s" x="728" y="163">Tavily Search API</text>

<rect class="n" x="620" y="230" width="216" height="64" rx="14" stroke="#3b82ff" style="animation-delay:1.5s"/>
<text class="t" x="728" y="258">Aviation Agent</text><text class="s" x="728" y="277">AviationStack API</text>

<rect class="n" x="290" y="420" width="180" height="64" rx="14" stroke="#6aa5ff" style="animation-delay:2s"/>
<text class="t" x="380" y="448">PostgreSQL</text><text class="s" x="380" y="467">workflow checkpointer</text>

<g filter="url(#glow)">
<circle r="4.5" fill="#22e4ff"><animateMotion dur="1.8s" repeatCount="indefinite" path="M174 262 L316 262"/></circle>
<circle r="4.5" fill="#ff9b3b"><animateMotion dur="2s" repeatCount="indefinite" path="M380 198 L380 120"/></circle>
<circle r="4.5" fill="#22e4ff"><animateMotion dur="2.4s" repeatCount="indefinite" path="M432 222 L620 148"/></circle>
<circle r="4.5" fill="#3b82ff"><animateMotion dur="2.2s" repeatCount="indefinite" path="M444 262 L620 262"/></circle>
<circle r="4.5" fill="#6aa5ff"><animateMotion dur="2.1s" repeatCount="indefinite" path="M380 326 L380 420"/></circle>
<circle r="4.5" fill="#6aa5ff"><animateMotion dur="2.1s" begin="1s" repeatCount="indefinite" path="M380 420 L380 326"/></circle>
<circle r="4.5" fill="#9b6bff"><animateMotion dur="2.8s" repeatCount="indefinite" path="M330 304 Q 200 410 100 294"/></circle>
<circle r="3.5" fill="#fff" opacity=".8"><animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite" path="M330 304 Q 200 410 100 294"/></circle>
</g>
<text x="836" y="500" text-anchor="end" fill="#55638a" font-family="Segoe UI,Arial,sans-serif" font-size="10">github.com/Vipul24G/multi-agent-travel-planner</text>
</svg>
